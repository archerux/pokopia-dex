<!doctype html>
<!--
  Pokopia Dex — single-file mobile companion app for Nintendo Switch 2 game Pokémon Pokopia.
  See CLAUDE.md for architecture, decisions, and conventions before making non-trivial changes.

  This file is intentionally self-contained: UI + CSS + ~380 KB embedded JSON.
  No build step, no framework, no backend. Deploys to any static host (currently Cloudflare Pages).
  Regenerate the embedded JSON via:  python scripts/build-data.py
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7AB951">
<title>Pokopia Dex</title>
<!-- Tailwind via CDN: we accept the prod warning to keep zero-build deploy. -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Pokopia branding fonts: Luckiest Guy (bubbly display, matches official site) + Nunito (friendly body). Fredoka kept as font-stack fallback only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Pokopia palette — greens/forest/red/teal — derived from the official pokopia.pokemon.com
     site colors (#c7e365 primary lime, #c4e5b4 muted green) diluted for comfortable reading. */
  :root {
    --cream:     #e4f5d0;   /* light spring green — page background */
    --cream-2:   #cde9b2;   /* meadow green — hover states, secondary areas */
    --surface:   #ffffff;
    --ink:       #2b3a1d;   /* dark forest, body text */
    --ink-2:     #4a5a36;
    --muted:     #7a8a60;
    --muted-2:   #9aac7e;
    --border:    #c0d99a;   /* sage green — borders and dividers */
    --brand:     #7AB951;   /* grass green — primary brand */
    --brand-dk:  #5e9c39;
    --red:       #e63946;
    --orange:    #f4a93c;
    --teal:      #4fb5c0;
  }
  html, body { background: var(--cream); color: var(--ink); }
  body { font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding-bottom: env(safe-area-inset-bottom); padding-top: env(safe-area-inset-top); }
  /* The green/cream quilt-checker pattern is already baked into the Pokopia logo image, so the
     body is plain cream and the pattern only appears where the brand mark sits. */
  .scroll-area { -webkit-overflow-scrolling: touch; }
  /* Pixel sprite crispness */
  .pixel-sprite { image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }

  /* Pokopia wordmark — fallback used only when the official logo image hotlink fails (see
     pokopiaWordmark() in JS). Each "pokopia" letter is colored to echo the official logo's
     playful per-letter palette so the brand is still recognizable when the image is missing. */
  .pokopia-wordmark { font-family: "Luckiest Guy", "Fredoka", "Nunito", sans-serif; font-weight: 400; line-height: 1; letter-spacing: 0.03em; display: inline-flex; align-items: baseline; gap: 0.35em; }
  .pokopia-wordmark .pkmn { color: var(--ink); font-size: 0.55em; letter-spacing: 0.02em; }
  .pokopia-wordmark .word { display: inline-flex; }
  .pokopia-wordmark .word span { display: inline-block; -webkit-text-stroke: 1px #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.08); }
  .pokopia-wordmark .l1{color:var(--red)}.pokopia-wordmark .l2{color:var(--orange)}
  .pokopia-wordmark .l3{color:var(--red)}.pokopia-wordmark .l4{color:var(--brand)}
  .pokopia-wordmark .l5{color:var(--orange)}.pokopia-wordmark .l6{color:var(--red)}
  .pokopia-wordmark .l7{color:var(--teal)}

  /* Pokémon type colors — inline (not Tailwind utilities) because Tailwind CDN doesn't ship a Pokémon type palette and we don't run a Tailwind build. */
  .type-Normal{background:#a8a77a;color:#fff}.type-Fire{background:#ee8130;color:#fff}.type-Water{background:#6390f0;color:#fff}
  .type-Electric{background:#f7d02c;color:#1a1a1a}.type-Grass{background:#7ac74c;color:#fff}.type-Ice{background:#96d9d6;color:#1a1a1a}
  .type-Fighting{background:#c22e28;color:#fff}.type-Poison{background:#a33ea1;color:#fff}.type-Ground{background:#e2bf65;color:#1a1a1a}
  .type-Flying{background:#a98ff3;color:#fff}.type-Psychic{background:#f95587;color:#fff}.type-Bug{background:#a6b91a;color:#fff}
  .type-Rock{background:#b6a136;color:#fff}.type-Ghost{background:#735797;color:#fff}.type-Dragon{background:#6f35fc;color:#fff}
  .type-Dark{background:#705746;color:#fff}.type-Steel{background:#b7b7ce;color:#1a1a1a}.type-Fairy{background:#d685ad;color:#1a1a1a}
  /* Habitat tints — re-balanced for the new light theme (warmer, slightly more saturated) */
  .hab-Bright{background:linear-gradient(135deg,#fef3c7,#fbbf24aa);border:1px solid #f59e0b;color:#7a4a00}
  .hab-Dark  {background:linear-gradient(135deg,#ddd6fe,#8b5cf6aa);border:1px solid #6d28d9;color:#3a1b6e}
  .hab-Cool  {background:linear-gradient(135deg,#cffafe,#22d3eeaa);border:1px solid #06b6d4;color:#0e4a52}
  .hab-Warm  {background:linear-gradient(135deg,#ffedd5,#fb923caa);border:1px solid #ea580c;color:#7a2f00}
  .hab-Humid {background:linear-gradient(135deg,#d1fae5,#10b981aa);border:1px solid #047857;color:#0f4d35}
  .hab-Dry   {background:linear-gradient(135deg,#fef3c7,#d6a55aaa);border:1px solid #a16207;color:#6b3700}
  .hab-Default{background:#cde9b2;border:1px solid var(--border);color:var(--ink-2)}

  /* Bottom nav safe area */
  .bottom-nav { padding-bottom: max(env(safe-area-inset-bottom), 0.5rem); }
  /* Slide up animation */
  @keyframes slideUp { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .anim-slide { animation: slideUp .18s ease-out; }
  /* Hide native select chevron + replace with a green one matching the theme */
  select { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%237AB951' d='M6 8L0 0h12z'/></svg>"); background-repeat: no-repeat; background-position: right 0.6rem center; padding-right: 1.75rem; }
  /* Friendlier card shadow for surfaces sitting on the cream background */
  .pop-card { box-shadow: 0 1px 0 rgba(43,58,29,0.04), 0 4px 12px rgba(43,58,29,0.06); }
</style>
</head>

:"mushroomsoup","name":"Mushroom soup","desc":"A soup with a dry flavor made with mushroom broth.. Powers up Water Gun when eaten."},{"slug":"mushroomhamburgersteak","name":"Mushroom hamburger steak","desc":"A hamburger steak with an intensely dry, mushroomy flavor. Powers up Rock Smash when eaten."},{"slug":"roseradetea","name":"Roserade Tea","desc":"Tea with a delicate, elegant aroma. If you take a sip and spit it out, it becomes a hot spring!"}]},"sour":{"slug":"sour","displayName":"Sour","items":[{"slug":"aspearberry","name":"Aspear Berry","desc":"This berry has a distinctively sharp sour taste. Restores some PP when eaten."},{"slug":"tomato","name":"Tomato","desc":"A round, tasty-looking tomato. Restores some PP when eaten"},{"slug":"shreddedsalad","name":"Shredded salad","desc":"A sour salad made with finely chopped leaves. Powers up Leafage when eaten."},{"slug":"flavorfulsoup","name":"Flavorful soup","desc":"A sour soup bursting with flavor. Powers up Water Gun when eaten."},{"slug":"leppabread","name":"Leppa bread","desc":"Sour-tasting bread made with Leppa Berry jam.. Powers up Cut when eaten."},{"slug":"tomatohamburgersteak","name":"Tomato hamburger steak","desc":"A hamburger steak that brings out the sour flavor of its ingredients.. Powers up Rock Smash when eaten."},{"slug":"sodapop","name":"Soda Pop","desc":"Fizzy, sparkling soda. If you take a sip and spit it out, it becomes seawater"}]},"spicy":{"slug":"spicy","displayName":"Spicy","items":[{"slug":"freshcarrot","name":"Fresh carrot","desc":"You can harvest these spicy carrots by pulling up on their leaves. Restores some PP when eaten."},{"slug":"croutonsalad","name":"Crouton salad","desc":"A spicy salad with a delightfully crunchy texture. Powers up Leafage when eaten."},{"slug":"electrifyingsoup","name":"Electrifying soup","desc":"A shockingly spicy soup.. Powers up Water Gun when eaten."},{"slug":"healthysoup","name":"Healthy soup","desc":"A spicy soup with an aromatic bean flavor.. Powers up Wate <script>
"use strict";
const DATA = JSON.parse(document.getElementById('pokopia-data').textContent);
const POKEMON = DATA.pokemon;
const FAVORITES = DATA.favorites; // {slug: {displayName, items[], likedBy[]}}
// LITTER: {itemSlug: {slug, name, pokemon: [{dex, name, natDex}]}} — reverse index of what
// each item is dropped by, so the Items tab can answer "who litters Honey?" in one lookup.
const LITTER = DATA.litter || {};
// FLAVORS: {flavorSlug: {slug, displayName, items: [{slug, name, desc}]}} keyed by lowercase
// flavor name. The spreadsheet's "Neutral" isn't one of Serebii's flavor slugs; flavorSlug()
// folds it (and the empty-string case) to 'none' so a neutral-flavor Pokémon's drawer falls
// back to the "No Flavor" food list instead of being empty.
const FLAVORS = DATA.flavors || {};
function flavorSlug(flavor) {
  const f = (flavor || '').trim().toLowerCase();
  if (!f || f === 'neutral') return 'none';
  return f;
}

// Sprite URLs — PokéAPI GitHub mirror. Pixel sprite for list rows (~5 KB, crisp at small sizes),
// official artwork for the detail hero (larger, transparent PNG, cached by the browser after first hit).
// `id` is the national dex number resolved at build time via data/dex-map.json.
const SPRITE_PIXEL = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
const SPRITE_ART   = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
// Item image URL — hotlinked from Serebii. The slug is captured at build time from Serebii's own
// URL (see scripts/build-data.py for why we don't derive it from the name). Parens and hyphens
// appear literally in some slugs; we do NOT encodeURIComponent because Serebii's server expects
// the raw characters in the path.
const ITEM_IMG = slug => `https://www.serebii.net/pokemonpokopia/items/${slug}.png`;

const HABITATS = ['Bright','Dark','Cool','Warm','Humid','Dry'];

// ---------- Routing (hash-based) ----------
// Hash routing is deliberate: works identically when the file is opened from disk (file://) and
// when deployed under any path on a static host. No server-side rewrite rules required.
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return { view: 'pokemon' };
  const parts = h.split('/');
  return { view: parts[0], id: decodeURIComponent(parts[1] || ''), sub: parts[2] };
}
function go(path) { location.hash = '#/' + path.replace(/^\/+/, ''); }
window.addEventListener('hashchange', render);

// ---------- State ----------
const state = {
  search: '',
  habitatFilter: '',
  specialtyFilter: '',
  filtersOpen: false,
  // The flavor-foods drawer on the detail page tracks open state per Pokémon key, so
  // toggling it on one Pokémon doesn't carry over when you navigate to another.
  flavorOpenFor: '',
  // itemQuery is per-category (cleared on navigation); favQuery is the global Items tab search.
  itemQuery: '',
  favQuery:  '',
};

// Filter state is persisted to sessionStorage (per-tab, ephemeral) wrapped in try/catch.
// Reasons we don't use localStorage: (1) some file:// contexts and private browsing deny it
// outright, (2) filters surviving across browser restarts is more confusing than helpful here.
try {
  const s = JSON.parse(sessionStorage.getItem('pokopia-state') || '{}');
  Object.assign(state, s);
} catch(e) {}
function saveState() {
  try { sessionStorage.setItem('pokopia-state', JSON.stringify(state)); } catch(e) {}
}

// ---------- Helpers ----------
// el() — tiny DOM-node creator. We use this instead of innerHTML or a template framework so all
// data-derived content (item descriptions from Serebii, etc.) is inserted as text nodes, which is
// XSS-safe by construction. Children that are strings become text nodes; objects are appended as-is.
function el(tag, attrs={}, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
function typeChip(t) {
  return el('span', { class: `type-${t} text-[10px] font-semibold uppercase tracking-wide px-1.5 py-0.5 rounded text-[#2b3a1d]` }, t);
}
function habitatPill(h) {
  if (!h) return null;
  return el('span', { class: `hab-${h||'Default'} text-xs font-medium px-2 py-0.5 rounded-full border` }, h);
}
// pokeKey — composite identity: dex number alone isn't unique (form variants like Toxtricity
// Amped vs Low Key share a dex; event Pokémon have no dex at all). Used in URLs and lookups.
function pokeKey(p) { return (p.natDex || '0') + ':' + p.displayName; }

// All unique specialties for filter dropdown
const ALL_SPECIALTIES = [...new Set(POKEMON.flatMap(p => p.specialties))].sort();

// ---------- Component helpers ----------
// itemThumb — standard 12×12 item image slot used in list rows. Returns null when no slug so
// rows with missing slug data fall back to text-only without an empty placeholder box.
// On image error the slot hides itself — no broken-image icon shown.
function itemThumb(slug) {
  if (!slug) return null;
  return el('div', { class: 'shrink-0 w-12 h-12 rounded-md bg-[#cde9b2]/80 flex items-center justify-center overflow-hidden' },
    el('img', {
      src: ITEM_IMG(slug), alt: '', loading: 'lazy', referrerpolicy: 'no-referrer',
      class: 'w-12 h-12 object-contain',
      onerror: function(){ this.parentNode.style.display = 'none'; }
    })
  );
}

// pokemonGridCard — sprite + name tile for the 3-column "Pokémon that like/drop this" grids.
function pokemonGridCard(p) {
  return el('button', {
    class: 'flex flex-col items-center gap-1 p-2 rounded-lg active:bg-[#cde9b2]',
    onclick: () => go(`pokemon/${encodeURIComponent(pokeKey(p))}`)
  },
    el('img', {
      src: SPRITE_PIXEL(p.natDex), alt: p.displayName, loading: 'lazy',
      class: 'pixel-sprite w-12 h-12',
      onerror: function(){ this.style.display='none'; }
    }),
    el('span', { class: 'text-[11px] text-[#2b3a1d] text-center leading-tight' }, p.displayName)
  );
}

// ---------- Views ----------
// Pokopia wordmark — uses the official logo image hotlinked from pokopia.pokemon.com, with the
// CSS wordmark as a graceful fallback if the image ever fails to load (e.g. hotlinking blocked
// or offline). The CSS wordmark's per-letter colors echo the official multi-color logotype.
const POKOPIA_LOGO_URL = 'https://pokopia.pokemon.com/assets/en-us/components/header/logo.png';

function pokopiaWordmarkCss(opts={}) {
  const size = opts.size || '1.5rem';
  return el('span', { class: 'pokopia-wordmark', style: 'font-size:' + size, 'aria-label': 'Pokémon Pokopia' },
    el('span', { class: 'pkmn' }, 'Pokémon'),
    el('span', { class: 'word' },
      el('span', { class: 'l1' }, 'P'),
      el('span', { class: 'l2' }, 'o'),
      el('span', { class: 'l3' }, 'k'),
      el('span', { class: 'l4' }, 'o'),
      el('span', { class: 'l5' }, 'p'),
      el('span', { class: 'l6' }, 'i'),
      el('span', { class: 'l7' }, 'a')
    )
  );
}

function pokopiaWordmark(opts={}) {
  const h = opts.height || 44;
  // <img> wrapped in a span so on error we can swap in the CSS wordmark in-place.
  const wrap = el('span', { class: 'pokopia-logo inline-flex items-center', style: 'height:' + h + 'px' });
  const img = el('img', {
    src: POKOPIA_LOGO_URL,
    alt: 'Pokémon Pokopia',
    referrerpolicy: 'no-referrer',
    loading: 'eager',
    decoding: 'async',
    style: 'height:100%;width:auto;display:block',
    onerror: function() {
      // Swap to the CSS wordmark if the official PNG can't be loaded.
      const fallback = pokopiaWordmarkCss({ size: (h * 0.55) + 'px' });
      this.replaceWith(fallback);
    }
  });
  wrap.appendChild(img);
  return wrap;
}

function renderHeader(title, subtitle, opts={}) {
  return el('header', { class: 'sticky top-0 z-20 bg-[#e4f5d0]/95 backdrop-blur border-b border-[#c0d99a]' },
    el('div', { class: 'px-4 pt-3 pb-2 flex items-center gap-2' },
      opts.back ? el('button', {
        class: 'shrink-0 -ml-1 w-9 h-9 rounded-full flex items-center justify-center text-[#3d4d26] active:bg-[#c0d99a]',
        onclick: () => { if (history.length > 1) history.back(); else go('pokemon'); },
        'aria-label': 'Back'
      }, el('span', { html: '&#8592;', class: 'text-xl' })) : null,
      el('div', { class: 'flex-1 min-w-0' },
        // If `opts.brand` is set, render the official Pokopia logo (with CSS-wordmark fallback).
        opts.brand
          ? el('div', { class: 'flex items-center gap-2 -my-1' },
              pokopiaWordmark({ height: 36 }),
              el('span', { class: 'text-lg text-[#5e9c39] uppercase', style: 'font-family:"Luckiest Guy","Fredoka",sans-serif' }, 'Pokopia Dex')
            )
          : el('h1', { class: 'text-xl text-[#2b3a1d] truncate uppercase tracking-wide', style: 'font-family:"Luckiest Guy","Fredoka",sans-serif' }, title),
        subtitle ? el('p', { class: 'text-xs text-[#7a8a60] truncate mt-0.5' }, subtitle) : null
      ),
      opts.right || null
    )
  );
}

function renderBottomNav(active) {
  // Active tab gets a soft green pill behind the icon to echo the Pokopia "happy/highlighted" feel.
  const tab = (key, label, icon) => el('button', {
    class: `flex-1 py-2 flex flex-col items-center gap-0.5 ${active === key ? 'text-[#5e9c39]' : 'text-[#7a8a60]'} active:opacity-80`,
    onclick: () => go(key)
  },
    el('span', {
      class: 'text-lg leading-none w-10 h-7 rounded-full flex items-center justify-center ' +
             (active === key ? 'bg-[#7AB951]/15' : ''),
      html: icon
    }),
    el('span', { class: 'text-[10px] font-semibold' }, label)
  );
  return el('nav', { class: 'bottom-nav sticky bottom-0 z-20 bg-[#e4f5d0]/95 backdrop-blur border-t border-[#c0d99a] flex' },
    // Icons chosen to fit the Pokopia "cozy garden" vibe. ALL must be BMP glyphs so they render
    // on platforms without an emoji font (e.g. headless Chromium in CI). Tested: 🌿 (U+1F33F)
    // failed as tofu in Linux Chromium → switched to ☘ shamrock (U+2618).
    tab('pokemon',   'Pokémon',   '&#9752;'),    // ☘ shamrock
    tab('habitats',  'Habitats',  '&#9728;'),
    tab('favorites', 'Items',     '&#10084;'),
    tab('about',     'About',     '&#8505;')
  );
}

// ---------- Pokémon list ----------
function viewPokemonList() {
  const search = state.search.trim().toLowerCase();
  const tokens = search.split(/\s+/).filter(Boolean);

  // Search uses each Pokémon's precomputed `_search` field (built at data-build time, contains
  // name+type+specialties+habitat lowercased). Multi-token AND match keeps it predictable.
  let list = POKEMON.slice();
  if (state.habitatFilter)  list = list.filter(p => p.habitat === state.habitatFilter);
  if (state.specialtyFilter) list = list.filter(p => p.specialties.includes(state.specialtyFilter));
  if (tokens.length) list = list.filter(p => tokens.every(t => p._search.includes(t)));

  const list_node = el('div', { class: 'divide-y divide-[#c0d99a]' },
    ...list.map((p, i) => el('button', {
      class: 'w-full flex items-center gap-3 px-4 py-2.5 text-left active:bg-[#cde9b2]',
      onclick: () => go(`pokemon/${encodeURIComponent(pokeKey(p))}`)
    },
      el('div', { class: 'shrink-0 w-14 h-14 rounded-lg bg-[#cde9b2]/80 flex items-center justify-center overflow-hidden' },
        el('img', {
          src: SPRITE_PIXEL(p.natDex), alt: p.displayName, loading: 'lazy',
          class: 'pixel-sprite w-12 h-12',
          onerror: function(){ this.style.display='none'; }
        })
      ),
      el('div', { class: 'flex-1 min-w-0' },
        el('div', { class: 'flex items-baseline gap-2' },
          el('span', { class: 'text-[10px] text-[#9aac7e] font-mono tabular-nums' }, '#' + (p.dex ?? '—')),
          el('span', { class: 'text-base font-medium text-[#2b3a1d] truncate' }, p.displayName)
        ),
        el('div', { class: 'mt-1 flex flex-wrap items-center gap-1.5' },
          ...p.types.map(typeChip),
          habitatPill(p.habitat),
          ...p.specialties.map(s => el('span', { class: 'text-[10px] text-white bg-[#5e9c39] px-1.5 py-0.5 rounded font-semibold' }, s))
        )
      ),
      el('span', { class: 'text-[#c4cfa5]', html: '&rsaquo;' })
    )),
    list.length === 0 ? el('div', { class: 'p-8 text-center text-[#9aac7e] text-sm' }, 'No Pokémon match those filters.') : null
  );

  return el('div', { class: 'flex flex-col min-h-screen' },
    renderHeader('Pokopia Dex', `${list.length} of ${POKEMON.length} Pokémon`, { brand: true }),
    // Header: search input + Filters toggle on one row. The habitat/specialty selects live in a
    // collapsible drawer below so they don't compete with the search bar visually. A count badge on
    // the toggle keeps the active filter count visible even when the drawer is closed.
    (() => {
      const activeCount = (state.habitatFilter ? 1 : 0) + (state.specialtyFilter ? 1 : 0);
      return el('div', { class: 'bg-[#e4f5d0] border-b border-[#c0d99a] sticky top-[3.4rem] z-10' },
        el('div', { class: 'p-3 flex gap-2 items-center' },
          el('input', {
            type: 'search', placeholder: 'Search by name, type, specialty…',
            value: state.search,
            'data-focus': 'main-search',
            class: 'flex-1 min-w-0 px-3 py-2 rounded-lg bg-white border border-[#c0d99a] text-[#2b3a1d] placeholder-[#9aac7e] outline-none focus:ring-2 focus:ring-[#7AB951]',
            oninput: e => { state.search = e.target.value; saveState(); render(); }
          }),
          el('button', {
            class: 'shrink-0 flex items-center gap-1.5 text-sm px-3 py-2 rounded-lg ' +
                   (activeCount || state.filtersOpen ? 'bg-[#7AB951] text-[#2b3a1d]' : 'bg-white border border-[#c0d99a] text-[#2b3a1d]') +
                   ' active:opacity-80',
            'aria-expanded': state.filtersOpen ? 'true' : 'false',
            onclick: () => { state.filtersOpen = !state.filtersOpen; saveState(); render(); }
          },
            el('span', {}, 'Filters'),
            activeCount ? el('span', { class: 'text-[10px] font-semibold bg-white/40 rounded-full px-1.5 py-0.5 leading-none' }, String(activeCount)) : null,
            el('span', { class: 'text-xs', html: state.filtersOpen ? '&#9652;' : '&#9662;' })
          )
        ),
        state.filtersOpen ? el('div', { class: 'px-3 pb-3 space-y-2 anim-slide' },
          el('div', { class: 'flex gap-2 text-sm' },
            el('select', {
              class: 'flex-1 bg-white border border-[#c0d99a] text-[#2b3a1d] rounded-lg px-2 py-1.5 outline-none',
              onchange: e => { state.habitatFilter = e.target.value; saveState(); render(); }
            },
              el('option', { value: '' }, 'Any habitat'),
              ...HABITATS.map(h => el('option', { value: h, selected: state.habitatFilter === h }, h))
            ),
            el('select', {
              class: 'flex-1 bg-white border border-[#c0d99a] text-[#2b3a1d] rounded-lg px-2 py-1.5 outline-none',
              onchange: e => { state.specialtyFilter = e.target.value; saveState(); render(); }
            },
              el('option', { value: '' }, 'Any specialty'),
              ...ALL_SPECIALTIES.map(s => el('option', { value: s, selected: state.specialtyFilter === s }, s))
            )
          ),
          (state.habitatFilter || state.specialtyFilter || state.search) ? el('button', {
            class: 'text-xs text-[#7a8a60] px-2 py-1 active:text-[#5e9c39]',
            onclick: () => { state.search=''; state.habitatFilter=''; state.specialtyFilter=''; saveState(); render(); }
          }, 'Clear all') : null
        ) : null
      );
    })(),
    el('div', { class: 'flex-1 scroll-area' }, list_node),
    renderBottomNav('pokemon')
  );
}

// ---------- Pokémon detail ----------
function viewPokemonDetail(id) {
  const p = POKEMON.find(x => pokeKey(x) === id);
  if (!p) return viewNotFound('Pokémon not found.');

  const header = renderHeader(p.displayName, p.types.join(' / ') + (p.habitat ? ' · ' + p.habitat : ''), { back: true });

  const heroBg = `hab-${p.habitat || 'Default'}`;
  const hero = el('div', { class: `${heroBg} border-b mx-3 mt-3 rounded-2xl p-4 flex items-center gap-4 anim-slide` },
    el('div', { class: 'shrink-0 w-28 h-28 rounded-xl bg-[#7AB951]/15 flex items-center justify-center overflow-hidden' },
      el('img', {
        src: SPRITE_ART(p.natDex), alt: p.displayName, loading: 'lazy',
        class: 'w-28 h-28 object-contain',
        onerror: function(){ this.src = SPRITE_PIXEL(p.natDex); this.className='pixel-sprite w-20 h-20 object-contain'; }
      })
    ),
    el('div', { class: 'flex-1 min-w-0' },
      el('div', { class: 'text-xs text-[#3d4d26]/80 font-mono' }, 'Pokopia #' + (p.dex ?? '—')),
      el('div', { class: 'text-xl text-[#2b3a1d] uppercase tracking-wide', style: 'font-family:"Luckiest Guy","Fredoka",sans-serif' }, p.displayName),
      el('div', { class: 'mt-2 flex flex-wrap gap-1.5' }, ...p.types.map(typeChip)),
      el('div', { class: 'mt-2 flex flex-wrap gap-1.5' },
        habitatPill(p.habitat),
        p.flavor ? el('span', { class: 'text-xs text-[#2b3a1d] bg-white/70 px-2 py-0.5 rounded-full font-semibold' }, '🍴 ' + p.flavor) : null
      )
    )
  );

  // infoRow renders one stat. If onClick is provided, render as a button with a chevron so users
  // know the row drills into a detail view (used for "Litters" since each item has its own page).
  function infoRow(label, value, onClick) {
    const base = 'flex justify-between items-center gap-3 py-2 border-b border-[#c0d99a] last:border-0 w-full text-left';
    const labelEl = el('span', { class: 'text-xs uppercase tracking-wide text-[#9aac7e]' }, label);
    const valueEl = el('span', { class: 'text-sm text-[#2b3a1d] text-right flex-1' }, value || '—');
    if (onClick) {
      return el('button', { class: base + ' active:bg-[#cde9b2]', onclick: onClick },
        labelEl, valueEl,
        el('span', { class: 'text-[#9aac7e] -mr-1', html: '&rsaquo;' })
      );
    }
    return el('div', { class: base }, labelEl, valueEl);
  }

  // Litter rows: a Pokémon can in principle drop more than one item (data model is a list);
  // today the cap is one, but we render generically so adding a multi-drop Pokémon Just Works.
  const litterRows = (p.litter || []).map(l =>
    infoRow('Litters', l.name, () => go(`litter/${l.slug}`))
  );

  // Flavor row + inline drawer. The row toggles a drawer below it showing every food of the
  // Pokémon's preferred flavor with images and descriptions. Open state is keyed per Pokémon
  // (via pokeKey) so navigating to a different Pokémon resets the drawer instead of carrying
  // it over confusingly. We use ▾/▴ to signal "expand in place" (vs › which signals navigate-away).
  const flavorSlugStr = flavorSlug(p.flavor);
  const flavorData = FLAVORS[flavorSlugStr];
  const flavorRowKey = pokeKey(p);
  const isFlavorOpen = state.flavorOpenFor === flavorRowKey && !!flavorData;
  let flavorRow;
  if (!p.flavor) {
    flavorRow = infoRow('Favorite flavor', '—');
  } else if (!flavorData) {
    // Pokémon has a flavor value the scrape didn't return foods for — render flat (no drawer).
    flavorRow = infoRow('Favorite flavor', p.flavor);
  } else {
    flavorRow = el('button', {
      class: 'flex justify-between items-center gap-3 py-2 border-b border-[#c0d99a] last:border-0 w-full text-left active:bg-[#cde9b2]',
      'aria-expanded': isFlavorOpen ? 'true' : 'false',
      onclick: () => {
        state.flavorOpenFor = isFlavorOpen ? '' : flavorRowKey;
        saveState(); render();
      }
    },
      el('span', { class: 'text-xs uppercase tracking-wide text-[#9aac7e]' }, 'Favorite flavor'),
      el('span', { class: 'text-sm text-[#2b3a1d] text-right flex-1' }, p.flavor),
      el('span', { class: 'text-[#7AB951] text-xs -mr-1', html: isFlavorOpen ? '&#9652;' : '&#9662;' })
    );
  }

  // Drawer body: appears INSIDE the info card so it visually belongs to the flavor row.
  // We mark each item row with `border-t` instead of border-b so the divider sits above each
  // item — and the last item still inherits the card's bottom rounding.
  const flavorDrawer = (isFlavorOpen && flavorData) ? el('div', { class: 'pb-2 anim-slide' },
    el('div', { class: 'flex items-baseline justify-between pt-2' },
      el('span', { class: 'text-[11px] uppercase tracking-wide text-[#7a8a60]' },
        `Foods · ${flavorData.displayName}`),
      el('span', { class: 'text-[11px] text-[#9aac7e]' }, `${flavorData.items.length} items`)
    ),
    el('div', { class: 'mt-2 -mx-4 border-t border-[#c0d99a] divide-y divide-[#c0d99a]' },
      ...flavorData.items.map(it => el('div', { class: 'px-4 py-2 flex items-start gap-3' },
        // Item image hotlinked from Serebii; collapse the slot on error so a missing image
        // doesn't show a broken-image glyph (same pattern as favorites/litter views).
        itemThumb(it.slug),
        el('div', { class: 'flex-1 min-w-0' },
          el('div', { class: 'text-[#2b3a1d] text-sm font-medium' }, it.name),
          it.desc ? el('div', { class: 'text-xs text-[#7a8a60] mt-0.5 leading-snug' }, it.desc) : null
        )
      ))
    )
  ) : null;

  const info = el('section', { class: 'mx-3 mt-3 rounded-2xl bg-white pop-card border border-[#c0d99a] px-4 anim-slide overflow-hidden' },
    infoRow('Specialty', p.specialties.join(', ')),
    infoRow('Ideal habitat', p.habitat),
    flavorRow,
    flavorDrawer,
    ...litterRows
  );

  const favs = el('section', { class: 'mx-3 mt-4 anim-slide' },
    el('div', { class: 'flex items-baseline justify-between px-1 mb-2' },
      el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[#7a8a60]' }, 'Favorite things'),
      el('span', { class: 'text-xs text-[#9aac7e]' }, `${p.favorites.length} categories`)
    ),
    p.favorites.length === 0
      ? el('div', { class: 'rounded-2xl bg-white pop-card border border-[#c0d99a] p-4 text-[#7a8a60] text-sm' },
          'No favorite categories listed for this Pokémon.')
      : el('div', { class: 'rounded-2xl bg-white pop-card border border-[#c0d99a] divide-y divide-[#c0d99a] overflow-hidden' },
          ...p.favorites.map(f => {
            const fav = f.slug ? FAVORITES[f.slug] : null;
            const itemCount = fav ? fav.items.length : 0;
            return el('button', {
              class: 'w-full flex items-center justify-between gap-3 px-4 py-3 text-left active:bg-[#cde9b2]',
              disabled: !f.slug,
              onclick: f.slug ? () => go(`favorite/${f.slug}`) : null
            },
              el('div', { class: 'flex-1 min-w-0' },
                el('div', { class: 'text-[#2b3a1d] text-base' }, f.name),
                el('div', { class: 'text-xs text-[#9aac7e] mt-0.5' },
                  f.slug ? `${itemCount} qualifying item${itemCount===1?'':'s'}` : 'No data available')
              ),
              el('span', { class: 'text-[#9aac7e]', html: '&rsaquo;' })
            );
          })
        )
  );

  return el('div', { class: 'flex flex-col min-h-screen' },
    header,
    el('div', { class: 'flex-1 scroll-area pb-6' }, hero, info, favs),
    renderBottomNav('pokemon')
  );
}

// ---------- Favorite category detail ----------
function viewFavoriteDetail(slug) {
  const fav = FAVORITES[slug];
  if (!fav) return viewNotFound('Favorite category not found.');

  const itemQuery = state.itemQuery;
  const filtered = itemQuery
    ? fav.items.filter(it => (it.name + ' ' + (it.desc||'')).toLowerCase().includes(itemQuery.toLowerCase()))
    : fav.items;

  const liked = fav.likedBy || [];

  const header = renderHeader(fav.displayName, `${fav.items.length} items · liked by ${liked.length} Pokémon`, { back: true });

  const itemsSection = el('section', { class: 'mx-3 mt-3 anim-slide' },
    el('div', { class: 'flex items-baseline justify-between px-1 mb-2' },
      el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[#7a8a60]' }, 'Qualifying items'),
      el('span', { class: 'text-xs text-[#9aac7e]' }, `${filtered.length}`)
    ),
    el('input', {
      type: 'search', placeholder: 'Filter items…',
      value: itemQuery,
      'data-focus': 'item-filter',
      class: 'w-full mb-2 px-3 py-2 rounded-lg bg-white border border-[#c0d99a] text-[#2b3a1d] placeholder-[#9aac7e] outline-none focus:ring-2 focus:ring-[#7AB951]',
      oninput: e => { state.itemQuery = e.target.value; render(); }
    }),
    el('div', { class: 'rounded-2xl bg-white pop-card border border-[#c0d99a] divide-y divide-[#c0d99a] overflow-hidden' },
      ...filtered.map(it => el('div', { class: 'px-4 py-2.5 flex items-start gap-3' },
        itemThumb(it.slug),
        el('div', { class: 'flex-1 min-w-0' },
          el('div', { class: 'text-[#2b3a1d] text-sm font-medium' }, it.name),
          it.desc ? el('div', { class: 'text-xs text-[#7a8a60] mt-0.5 leading-snug' }, it.desc) : null
        )
      )),
      filtered.length === 0 ? el('div', { class: 'p-6 text-center text-[#9aac7e] text-sm' }, 'No items match.') : null
    )
  );

  const likedSection = el('section', { class: 'mx-3 mt-4 mb-6 anim-slide' },
    el('div', { class: 'flex items-baseline justify-between px-1 mb-2' },
      el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[#7a8a60]' }, 'Pokémon that like this'),
      el('span', { class: 'text-xs text-[#9aac7e]' }, liked.length + '')
    ),
    el('div', { class: 'rounded-2xl bg-white pop-card border border-[#c0d99a] overflow-hidden' },
      el('div', { class: 'grid grid-cols-3 sm:grid-cols-4 gap-2 p-3' },
        ...liked.map(lp => {
          const full = POKEMON.find(x => x.dex === lp.dex && x.displayName === lp.name) ||
                       POKEMON.find(x => x.displayName === lp.name);
          return full ? pokemonGridCard(full) : null;
        })
      )
    )
  );

  return el('div', { class: 'flex flex-col min-h-screen' },
    header,
    el('div', { class: 'flex-1 scroll-area' }, itemsSection, likedSection),
    renderBottomNav('favorites')
  );
}

// ---------- Favorites + Litter index (the "Items" tab) ----------
// The Items tab serves two related browse flows:
//   1. Litter Drops — pick an item, see which Pokémon (with the Litter specialty) drop it.
//      Useful when a player needs a specific item and wants to know who to keep around.
//   2. Favorite Categories — pick a category, see qualifying items + which Pokémon love it.
//      Useful when planning what to give a Pokémon to raise its comfort level.
// Litter is shown first because it's more actionable — players usually open this tab knowing
// what item they want, not which category they're shopping for.
function viewFavoritesIndex() {
  const q = state.favQuery.toLowerCase();
  const slugs = Object.keys(FAVORITES).sort((a,b) =>
    FAVORITES[a].displayName.localeCompare(FAVORITES[b].displayName));
  const filtered = slugs.filter(s => FAVORITES[s].displayName.toLowerCase().includes(q));

  // Litter section: free-text search filters both lists by name.
  const litterSlugs = Object.keys(LITTER).sort((a,b) =>
    LITTER[a].name.localeCompare(LITTER[b].name));
  const filteredLitter = litterSlugs.filter(s => LITTER[s].name.toLowerCase().includes(q));

  const litterSection = el('section', { class: 'pt-3 anim-slide' },
    el('div', { class: 'flex items-baseline justify-between px-4 mb-2' },
      el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[#7a8a60]' }, 'Litter drops'),
      el('span', { class: 'text-xs text-[#9aac7e]' }, `${litterSlugs.length} items`)
    ),
    el('div', { class: 'mx-3 rounded-2xl bg-white pop-card border border-[#c0d99a] divide-y divide-[#c0d99a] overflow-hidden' },
      ...filteredLitter.map(slug => {
        const li = LITTER[slug];
        return el('button', {
          class: 'w-full flex items-center gap-3 px-3 py-2.5 text-left active:bg-[#cde9b2]',
          onclick: () => go(`litter/${slug}`)
        },
          itemThumb(slug),
          el('div', { class: 'flex-1 min-w-0' },
            el('div', { class: 'text-[#2b3a1d] text-base' }, li.name),
            el('div', { class: 'text-xs text-[#9aac7e] mt-0.5' },
              `dropped by ${li.pokemon.length} Pokémon`)
          ),
          el('span', { class: 'text-[#9aac7e]', html: '&rsaquo;' })
        );
      }),
      filteredLitter.length === 0 ? el('div', { class: 'p-6 text-center text-[#9aac7e] text-sm' }, 'No litter items match.') : null
    )
  );

  // Flavors section: 5 real flavors + a "No Flavor" universal-foods bucket. We hide the 'none'
  // bucket from the search filter unless the user actually types "no" or similar — keeps the
  // browse feeling like 5 flavors, but the bucket is still reachable via #/flavor/none.
  const flavorKeys = Object.keys(FLAVORS).sort((a,b) => {
    // Put 'none' last so the 5 real flavors come first alphabetically.
    if (a === 'none') return 1;
    if (b === 'none') return -1;
    return FLAVORS[a].displayName.localeCompare(FLAVORS[b].displayName);
  });
  const filteredFlavors = flavorKeys.filter(s => FLAVORS[s].displayName.toLowerCase().includes(q));
  const flavorsSection = el('section', { class: 'pt-5 anim-slide' },
    el('div', { class: 'flex items-baseline justify-between px-4 mb-2' },
      el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[#7a8a60]' }, 'Flavors'),
      el('span', { class: 'text-xs text-[#9aac7e]' }, `${flavorKeys.length} flavors`)
    ),
    el('div', { class: 'mx-3 rounded-2xl bg-white pop-card border border-[#c0d99a] divide-y divide-[#c0d99a] overflow-hidden' },
      ...filteredFlavors.map(slug => {
        const fl = FLAVORS[slug];
        // First item's image previews the flavor — a quick visual cue without bundling our own icons.
        const previewSlug = fl.items[0] && fl.items[0].slug;
        return el('button', {
          class: 'w-full flex items-center gap-3 px-3 py-2.5 text-left active:bg-[#cde9b2]',
          onclick: () => go(`flavor/${slug}`)
        },
          itemThumb(previewSlug),
          el('div', { class: 'flex-1 min-w-0' },
            el('div', { class: 'text-[#2b3a1d] text-base' }, fl.displayName),
            el('div', { class: 'text-xs text-[#9aac7e] mt-0.5' },
              `${fl.items.length} food${fl.items.length===1?'':'s'}`)
          ),
          el('span', { class: 'text-[#9aac7e]', html: '&rsaquo;' })
        );
      }),
      filteredFlavors.length === 0 ? el('div', { class: 'p-6 text-center text-[#9aac7e] text-sm' }, 'No flavors match.') : null
    )
  );

  const favSection = el('section', { class: 'pt-5 anim-slide' },
    el('div', { class: 'flex items-baseline justify-between px-4 mb-2' },
      el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[#7a8a60]' }, 'Favorite categories'),
      el('span', { class: 'text-xs text-[#9aac7e]' }, `${slugs.length} categories`)
    ),
    el('div', { class: 'divide-y divide-[#c0d99a] border-y border-[#c0d99a] bg-white' },
      ...filtered.map(slug => {
        const f = FAVORITES[slug];
        return el('button', {
          class: 'w-full flex items-center justify-between gap-3 px-4 py-3 text-left active:bg-[#cde9b2]',
          onclick: () => go(`favorite/${slug}`)
        },
          el('div', { class: 'flex-1 min-w-0' },
            el('div', { class: 'text-[#2b3a1d] text-base' }, f.displayName),
            el('div', { class: 'text-xs text-[#9aac7e] mt-0.5' },
              `${f.items.length} item${f.items.length===1?'':'s'} · liked by ${f.likedBy.length} Pokémon`)
          ),
          el('span', { class: 'text-[#9aac7e]', html: '&rsaquo;' })
        );
      }),
      filtered.length === 0 ? el('div', { class: 'p-8 text-center text-[#9aac7e] text-sm' }, 'No categories match.') : null
    )
  );

  return el('div', { class: 'flex flex-col min-h-screen' },
    renderHeader('Items',
      `${litterSlugs.length} litter · ${flavorKeys.length} flavors · ${slugs.length} categories`),
    el('div', { class: 'p-3 bg-[#e4f5d0] border-b border-[#c0d99a] sticky top-[3.4rem] z-10' },
      // One search box filters all three sections — keeps the layout tight on mobile.
      el('input', {
        type: 'search', placeholder: 'Search litter, flavors, categories…',
        value: state.favQuery || '',
        'data-focus': 'fav-search',
        class: 'w-full px-3 py-2 rounded-lg bg-white border border-[#c0d99a] text-[#2b3a1d] placeholder-[#9aac7e] outline-none focus:ring-2 focus:ring-[#7AB951]',
        oninput: e => { state.favQuery = e.target.value; render(); }
      })
    ),
    // Section order: Litter (most actionable) → Flavors (small, valuable for cooking decisions)
    // → Favorite Categories (largest pool, biggest scroll target — last).
    el('div', { class: 'flex-1 scroll-area pb-6' }, litterSection, flavorsSection, favSection),
    renderBottomNav('favorites')
  );
}

// ---------- Flavor detail ----------
// Standalone view for "what foods satisfy <flavor>". Reachable from the Items tab. (On Pokémon
// detail pages we render the same list as an inline drawer — see the flavor row in viewPokemonDetail.)
function viewFlavorDetail(slug) {
  const fl = FLAVORS[slug];
  if (!fl) return viewNotFound('Flavor not found.');

  const header = renderHeader(fl.displayName, `${fl.items.length} foods`, { back: true });

  const hero = el('section', { class: 'mx-3 mt-3 rounded-2xl bg-white pop-card border border-[#c0d99a] p-4 anim-slide' },
    el('div', { class: 'text-xs uppercase tracking-wide text-[#9aac7e]' }, 'Flavor'),
    el('div', { class: 'text-xl text-[#2b3a1d] uppercase tracking-wide', style: 'font-family:"Luckiest Guy","Fredoka",sans-serif' }, fl.displayName),
    el('div', { class: 'text-xs text-[#7a8a60] mt-1' },
      slug === 'none'
        ? 'Foods with no specific flavor — generally satisfying to any Pokémon.'
        : `Pokémon with a ${fl.displayName.toLowerCase()} flavor preference will love these foods.`)
  );

  const list = el('section', { class: 'mx-3 mt-4 mb-6 anim-slide' },
    el('div', { class: 'flex items-baseline justify-between px-1 mb-2' },
      el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[#7a8a60]' }, 'Foods'),
      el('span', { class: 'text-xs text-[#9aac7e]' }, fl.items.length + '')
    ),
    el('div', { class: 'rounded-2xl bg-white pop-card border border-[#c0d99a] divide-y divide-[#c0d99a] overflow-hidden' },
      ...fl.items.map(it => el('div', { class: 'px-4 py-2.5 flex items-start gap-3' },
        itemThumb(it.slug),
        el('div', { class: 'flex-1 min-w-0' },
          el('div', { class: 'text-[#2b3a1d] text-sm font-medium' }, it.name),
          it.desc ? el('div', { class: 'text-xs text-[#7a8a60] mt-0.5 leading-snug' }, it.desc) : null
        )
      ))
    )
  );

  return el('div', { class: 'flex flex-col min-h-screen' },
    header,
    el('div', { class: 'flex-1 scroll-area' }, hero, list),
    renderBottomNav('favorites')
  );
}

// ---------- Litter item detail ----------
// Mirror of viewFavoriteDetail's "liked by" grid: shows the item + every Pokémon that drops it.
function viewLitterDetail(slug) {
  const li = LITTER[slug];
  if (!li) return viewNotFound('Litter item not found.');

  const header = renderHeader(li.name, `Litter drop · ${li.pokemon.length} Pokémon`, { back: true });

  const hero = el('section', { class: 'mx-3 mt-3 rounded-2xl bg-white pop-card border border-[#c0d99a] p-4 flex items-center gap-4 anim-slide' },
    el('div', { class: 'shrink-0 w-20 h-20 rounded-xl bg-[#cde9b2]/80 flex items-center justify-center overflow-hidden' },
      el('img', {
        src: ITEM_IMG(slug), alt: li.name, loading: 'eager', referrerpolicy: 'no-referrer',
        class: 'w-20 h-20 object-contain',
        onerror: function(){ this.parentNode.style.display = 'none'; }
      })
    ),
    el('div', { class: 'flex-1 min-w-0' },
      el('div', { class: 'text-xs uppercase tracking-wide text-[#9aac7e]' }, 'Litter item'),
      el('div', { class: 'text-xl text-[#2b3a1d] uppercase tracking-wide', style: 'font-family:"Luckiest Guy","Fredoka",sans-serif' }, li.name),
      el('div', { class: 'text-xs text-[#7a8a60] mt-1' },
        `Dropped by ${li.pokemon.length} Pokémon with the Litter specialty.`)
    )
  );

  const grid = el('section', { class: 'mx-3 mt-4 mb-6 anim-slide' },
    el('div', { class: 'flex items-baseline justify-between px-1 mb-2' },
      el('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[#7a8a60]' }, 'Pokémon that drop this'),
      el('span', { class: 'text-xs text-[#9aac7e]' }, li.pokemon.length + '')
    ),
    el('div', { class: 'rounded-2xl bg-white pop-card border border-[#c0d99a] overflow-hidden' },
      el('div', { class: 'grid grid-cols-3 sm:grid-cols-4 gap-2 p-3' },
        ...li.pokemon.map(lp => {
          const full = POKEMON.find(x => x.dex === lp.dex && x.displayName === lp.name) ||
                       POKEMON.find(x => x.displayName === lp.name);
          return full ? pokemonGridCard(full) : null;
        })
      )
    )
  );

  return el('div', { class: 'flex flex-col min-h-screen' },
    header,
    el('div', { class: 'flex-1 scroll-area' }, hero, grid),
    renderBottomNav('favorites')
  );
}

// ---------- Habitats index ----------
function viewHabitats() {
  return el('div', { class: 'flex flex-col min-h-screen' },
    renderHeader('Browse by Habitat'),
    el('div', { class: 'flex-1 scroll-area p-3 grid grid-cols-2 gap-3' },
      ...HABITATS.map(h => {
        const count = POKEMON.filter(p => p.habitat === h).length;
        return el('button', {
          class: `hab-${h} rounded-2xl border p-4 text-left active:scale-[0.98] transition`,
          onclick: () => { state.habitatFilter = h; saveState(); go('pokemon'); }
        },
          el('div', { class: 'text-[#2b3a1d] font-semibold text-lg' }, h),
          el('div', { class: 'text-xs text-[#3d4d26]/80 mt-1' }, `${count} Pokémon`)
        );
      })
    ),
    renderBottomNav('habitats')
  );
}

// ---------- About ----------
function viewAbout() {
  return el('div', { class: 'flex flex-col min-h-screen' },
    renderHeader('About'),
    el('div', { class: 'flex-1 scroll-area p-4 space-y-4 text-sm text-[#3d4d26] leading-relaxed' },
      el('div', { class: 'rounded-2xl bg-white pop-card border border-[#c0d99a] p-4' },
        el('h2', { class: 'text-[#2b3a1d] font-semibold mb-2' }, 'Pokopia Dex'),
        el('p', {}, 'A quick companion guide for the Nintendo Switch 2 game Pokémon Pokopia. Look up a Pokémon to see their specialty, ideal habitat, favorite flavor, and what kinds of items they like — then tap a favorite category to see which specific items qualify.')
      ),
      el('div', { class: 'rounded-2xl bg-white pop-card border border-[#c0d99a] p-4 space-y-1' },
        el('h3', { class: 'text-[#2b3a1d] font-semibold mb-1' }, 'Data'),
        el('div', {}, `· ${POKEMON.length} Pokémon`),
        el('div', {}, `· ${Object.keys(FAVORITES).length} favorite categories`),
        el('div', {}, `· ${Object.values(FAVORITES).reduce((n,f)=>n+f.items.length,0)} catalogued items`)
      ),
      el('div', { class: 'rounded-2xl bg-white pop-card border border-[#c0d99a] p-4 space-y-2' },
        el('h3', { class: 'text-[#2b3a1d] font-semibold mb-1' }, 'Credits'),
        el('p', {}, 'Pokémon data compiled from a community spreadsheet. Favorite-item lists and item images served from ',
          el('a', { href: 'https://www.serebii.net/pokemonpokopia/favorites.shtml', class: 'text-[#5e9c39] underline', target: '_blank', rel: 'noopener' }, 'Serebii.net'),
          '. Pokémon sprites from the ',
          el('a', { href: 'https://pokeapi.co/', class: 'text-[#5e9c39] underline', target: '_blank', rel: 'noopener' }, 'PokéAPI'),
          ' sprite repository.'),
        el('p', {}, 'Visit the official ',
          el('a', { href: 'https://pokopia.pokemon.com/en-us/', class: 'text-[#5e9c39] underline', target: '_blank', rel: 'noopener' }, 'Pokémon Pokopia'),
          ' site for the game itself. This is an unofficial fan-made companion guide and is not affiliated with or endorsed by Nintendo, Game Freak, Creatures Inc., The Pokémon Company, or KOEI TECMO GAMES. Pokémon and the Pokopia logo are trademarks of their respective owners.')
      )
    ),
    renderBottomNav('about')
  );
}

function viewNotFound(msg) {
  return el('div', { class: 'flex flex-col min-h-screen' },
    renderHeader('Not found', '', { back: true }),
    el('div', { class: 'flex-1 flex items-center justify-center text-[#7a8a60]' }, msg),
    renderBottomNav('pokemon')
  );
}

// ---------- Router / mount ----------
function render() {
  const r = parseHash();
  // Clear the per-category item filter when navigating to a different route so it doesn't
  // bleed across from one favorite category to another.
  if (render._lastHash && render._lastHash !== location.hash) {
    state.itemQuery = '';
  }
  let view;
  if (r.view === '' || r.view === 'pokemon' && !r.id) view = viewPokemonList();
  else if (r.view === 'pokemon' && r.id) view = viewPokemonDetail(r.id);
  else if (r.view === 'favorites') view = viewFavoritesIndex();
  else if (r.view === 'favorite' && r.id) view = viewFavoriteDetail(r.id);
  else if (r.view === 'litter' && r.id) view = viewLitterDetail(r.id);
  else if (r.view === 'flavor' && r.id) view = viewFlavorDetail(r.id);
  else if (r.view === 'habitats') view = viewHabitats();
  else if (r.view === 'about') view = viewAbout();
  else view = viewPokemonList();

  // Preserve focus + caret across the rebuild. Without this, typing into a search input would
  // dismiss the on-screen keyboard on mobile after every keystroke: oninput → render() →
  // replaceChildren() unmounts the focused <input>, so the new <input> in the next tree has no
  // focus and the soft keyboard collapses. We tag each search input with data-focus="<id>" and
  // re-focus the matching element in the new tree, also restoring selectionStart/End so the caret
  // doesn't jump to the end of the value.
  const focusEl = document.activeElement;
  const focusKey = focusEl && focusEl.dataset ? focusEl.dataset.focus : null;
  const selStart = focusKey ? focusEl.selectionStart : null;
  const selEnd   = focusKey ? focusEl.selectionEnd   : null;

  const app = document.getElementById('app');
  app.replaceChildren(view);

  if (focusKey) {
    const target = app.querySelector('[data-focus="' + focusKey + '"]');
    if (target) {
      target.focus({ preventScroll: true });
      try { if (selStart != null) target.setSelectionRange(selStart, selEnd); }
      catch (e) { /* type=search on some browsers rejects setSelectionRange — safe to ignore */ }
    }
  }

  // Scroll to top on route change (but not on every render — would jank typing into a sticky search)
  if (!render._lastHash || render._lastHash !== location.hash) {
    window.scrollTo(0, 0);
    render._lastHash = location.hash;
  }
}

// Initial render
render();
</script>
